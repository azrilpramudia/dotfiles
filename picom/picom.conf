# ==================================================== #
#                  PICOM CONFIG FULL                   #
#     Optimized for Intel HD 5500 + i5-5200U           #
#     With Blur: Terminal + Panel (XFCE)               #
# ==================================================== #

#################################
#             Backend           #
#################################
backend = "glx";
vsync = true;
use-damage = false;

# Flag optimasi khusus Intel iGPU lama
glx-no-stencil = true;
glx-copy-from-front = false;
glx-no-rebind-pixmap = true;

#################################
#             Corners           #
#################################
corner-radius = 8;

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 5;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.6;
shadow-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'Conky'"
];

#################################
#             Fading            #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

#################################
#   Transparency / Opacity      #
#################################
frame-opacity = 0.8;
detect-client-opacity = true;

#################################
#             Blur              #
#################################
blur-method = "dual_kawase";
blur-strength = 3;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
# blur background exclude
blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'Conky'",
    "class_g = 'slop'",
    "class_g = 'Plank'",
    "class_g = 'xfce4-screenshooter'",
    "class_g = 'gnome-screenshot'",
    "class_g = 'flameshot'",
];

#################################
#       General Settings        #
#################################
detect-rounded-corners = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
dbe = false;
log-level = "warn";

#################################
#            Rules              #
#################################
rules: ({
    # Plank no Blur
    match = "class_g = 'Plank'";
    blur-background = false;
    shadow = false;
    fade = false;
    opacity = 1.0;
}, {
    # Panel blur
    match = "window_type = 'dock' && !(class_g = 'Plank')";
    blur-background = true;
    shadow = false;
    fade = false;
    opacity = 0.85;
}, {
    match = "window_type = 'desktop'";
    blur-background = false;
    shadow = false;
    fade = false;
}, {
    match = "class_g = 'kitty'";
    blur-background = true;
    shadow = true;
    fade = true;
}, {
    match = "class_g = 'Alacritty'";
    blur-background = true;
    shadow = true;
    fade = true;
}, {
    match = "class_g = 'Xfce4-terminal'";
    blur-background = true;
    shadow = true;
    fade = true;
}, {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.75;
    blur-background = false;
}, {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    blur-background = false;
    fade = false;
    shadow = false;
}, {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd'";
    shadow = false;
    blur-background = false;
    fade = false;
})

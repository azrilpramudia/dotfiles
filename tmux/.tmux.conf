# ----- ESSENTIAL SETTINGS -----

# Fix Vim ESC delay (1ms is more stable than 0 on some Linux distros)
set -sg escape-time 1

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events
set -g focus-events on

# Set terminal colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Aggressive resize
setw -g aggressive-resize on

# ----- KEY BINDINGS -----

# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config instant
bind r source-file ~/.tmux.conf \; display "Reload Config"

# Split panes using intuitive sysmbols (| and -) 
# Stay on the same path when splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigasi Pane like Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize Pane like Vim (hold the prefix then press H, J, K, L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- APPEARANCE -----

set -g status-position top
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 30
set -g status-right-length 60

# Left status : Session name
set -g status-left '#[fg=#00e68a,bold]  #S #[fg=#30363d]│ '

# Right Status : time, date, and user
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Style for window active and not active
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#00e68a,bold,bg=#21262d] #I:#W '

# Border pane to avoid confusion
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'

# middle popup style
set -g message-style 'bg=#00e68a fg=#000000 bold'

# ----- COPY MODE (Linux/XFCE Integration) -------

setw -g mode-keys vi

# Bind 'v' to start selection, and 'y' to copy to the Linux clipboard (xclip)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Right Click Mouse (Optional Copy Paste)
# unbind -n MouseDown3Pane

# ---- PLUGINS -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin Settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Run Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
